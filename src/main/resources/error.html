<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Помилка — CakeHouse</title>
    <th:block th:replace="~{header :: head}"></th:block>
    <style>
        .error-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
            text-align: center;
            padding: 2rem;
        }
        .error-code {
            font-size: 6rem;
            font-weight: 700;
            color: var(--primary, #c0665a);
            line-height: 1;
        }
        .error-msg {
            font-size: 1.2rem;
            color: #555;
            margin: 1rem 0 2rem;
            max-width: 500px;
        }
    </style>
</head>
<body>
<th:block th:replace="~{header :: navbar}"></th:block>

<main class="error-wrapper">
    <div class="error-code" th:text="${errorCode} ?: '500'">500</div>
    <p class="error-msg" th:text="${errorMessage} ?: 'Щось пішло не так. Спробуйте пізніше.'">
        Щось пішло не так.
    </p>
    <a href="/" class="btn btn-primary">← На головну</a>
</main>
</body>
</html>
