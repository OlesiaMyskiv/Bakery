<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Помилка — Cake House</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;700&family=Love+Light&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/globals.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header th:replace="~{header :: header}"></header>

<main style="display:flex; flex-direction:column; align-items:center; justify-content:center;
             min-height:60vh; text-align:center; padding:2rem;">

    <div style="font-size:6rem; font-family:'Love Light',cursive; color:#c0665a; line-height:1;"
         th:text="${errorCode} ?: '500'">500</div>

    <p style="font-family:'Cormorant Garamond',serif; font-size:1.3rem; color:#5a3a2a;
              margin:1rem 0 0.5rem; max-width:500px;"
       th:text="${errorMessage} ?: 'Щось пішло не так. Спробуйте пізніше.'">
        Щось пішло не так.
    </p>

    <p style="font-family:'Cormorant Garamond',serif; color:#888; margin-bottom:2rem;">
        Якщо проблема повторюється — зверніться до нас через чат.
    </p>

    <a href="/" style="display:inline-block; padding:0.75rem 2rem; background:#c0665a; color:white;
                       border-radius:8px; text-decoration:none; font-family:'Cormorant Garamond',serif;
                       font-size:1.1rem;">
        ← На головну
    </a>

</main>

</body>
</html>
