<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Cake House - Вхід</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;700&family=Love+Light&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/globals.css}">
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body class="login-body">

<header th:replace="~{header :: header}"></header>

<main class="login-main">
    <div class="login-card">
        <h2 class="login-title">Вхід</h2>

        <div th:if="${param.error}" style="color: #d9534f; background-color: #f2dede; padding: 10px; border-radius: 5px; margin-bottom: 15px; text-align: center; font-weight: bold; font-family: 'Cormorant Garamond', serif; font-size: 1.2rem;">
            Невірна електронна пошта або пароль!
        </div>

        <div th:if="${param.logout}" style="color: #3c763d; background-color: #dff0d8; padding: 10px; border-radius: 5px; margin-bottom: 15px; text-align: center; font-family: 'Cormorant Garamond', serif; font-size: 1.2rem;">
            Ви успішно вийшли з системи.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="input-group">
                <label>Електронна пошта</label>
                <input type="email" name="username" required>
            </div>

            <div class="input-group">
                <label>Пароль:</label>
                <input type="password" name="password" required>
                <a th:href="@{/forgot-password}" class="forgot-password">Забули пароль?</a>
            </div>

            <button type="submit" class="login-btn">Увійти</button>
        </form>

        <div class="register-link">
            Немає облікового запису? <a th:href="@{/register}">Реєстрація</a>
        </div>
    </div>
</main>

</body>
</html>
