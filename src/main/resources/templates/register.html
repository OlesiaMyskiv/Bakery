<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Cake House - Реєстрація</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;700&family=Love+Light&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/globals.css}">
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body class="login-body">

<header th:replace="~{header :: header}"></header>

<main class="login-main">
    <div class="login-card register-card">
        <h2 class="login-title">Реєстрація</h2>
        <p th:if="${error}" th:text="${error}" style="color: red; text-align: center; font-size: 18px;"></p>

        <form th:action="@{/register}" method="post" enctype="multipart/form-data">
            <div class="input-group">
                <label>Ім'я та прізвище користувача:</label>
                <input type="text" name="username" required>
            </div>

            <div class="input-group">
                <label>Телефон:</label>
                <input type="tel" name="phone" placeholder="+380" required>
            </div>

            <div class="input-group">
                <label>Електронна пошта:</label>
                <input type="email" name="email" required>
            </div>

            <div class="input-group">
                <label>Пароль:</label>
                <input type="password" name="password" minlength="8" required>
            </div>

            <div class="input-group">
                <label>Підтвердження паролю:</label>
                <input type="password" name="confirm_password" required>
            </div>

            <div class="status-group">
                <label class="status-label-main">Вибір статусу:</label>

                <label class="custom-radio">
                    <input type="radio" name="role" value="CLIENT" checked onchange="toggleSpecialFields()">
                    <span class="radio-mark"></span> Звичайний клієнт
                </label>

                <label class="custom-radio">
                    <input type="radio" name="role" value="ZSU" onchange="toggleSpecialFields()">
                    <span class="radio-mark"></span> Військовослужбовець (ЗСУ)
                </label>

                <label class="custom-radio">
                    <input type="radio" name="role" value="DPSU" onchange="toggleSpecialFields()">
                    <span class="radio-mark"></span> Співробітник ДПСУ
                </label>

                <label class="custom-radio">
                    <input type="radio" name="role" value="DSNS" onchange="toggleSpecialFields()">
                    <span class="radio-mark"></span> Співробітник ДСНС
                </label>
            </div>

            <div id="special-fields" style="display: none;">
                <label class="status-label-main text-center">Прикріпити посвідчення (ЗСУ, ДПСУ або ДСНС):</label>

                <div class="file-upload-box">
                    <input type="file" id="document-upload" name="document" accept="image/*">
                    <label for="document-upload">+</label>
                </div>

                <label class="custom-checkbox">
                    <input type="checkbox" id="consent-check">
                    <span class="checkmark"></span>
                    <span class="consent-text">Я підтверджую справжність документа та надаю згоду на обробку персональних даних</span>
                </label>
            </div>

            <button type="submit" class="login-btn">Створити акаунт</button>
        </form>
    </div>
</main>

<footer th:replace="~{footer :: footer}"></footer>

<script>
    function toggleSpecialFields() {
        const selectedRole = document.querySelector('input[name="role"]:checked').value;
        const specialFields = document.getElementById('special-fields');
        const consentCheck = document.getElementById('consent-check');
        const docUpload = document.getElementById('document-upload');

        // Додаємо ДПСУ в список перевірки
        if (selectedRole === 'ZSU' || selectedRole === 'DSNS' || selectedRole === 'DPSU') {
            specialFields.style.display = 'block';
            consentCheck.required = true;
            docUpload.required = true; // Робимо файл теж обов'язковим для пільговиків
        } else {
            specialFields.style.display = 'none';
            consentCheck.required = false;
            docUpload.required = false;
        }
    }
</script>

</body>
</html>
