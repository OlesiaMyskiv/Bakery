<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cake House - Новий пароль</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;700&family=Love+Light&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/globals.css}">
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body class="login-body">

<header th:replace="~{header :: header}"></header>

<main class="login-main">
    <div class="login-card">
        <h2 class="login-title">Новий пароль</h2>

        <!-- ❌ Токен недійсний або прострочений -->
        <div th:if="${error}" th:unless="${token}">
            <div style="background:#fdecea; color:#c62828; border:1px solid #ef9a9a;
                        border-radius:8px; padding:14px 16px; margin-bottom:20px;
                        font-family:'Cormorant Garamond',serif; font-size:1.05rem; text-align:center;">
                ⚠️ <span th:text="${error}"></span>
            </div>
            <div style="text-align:center; margin-top:16px;">
                <a th:href="@{/forgot-password}" class="login-btn"
                   style="display:inline-block; text-decoration:none;">
                    Запросити нове посилання
                </a>
            </div>
        </div>

        <!-- ✅ Токен валідний — показуємо форму -->
        <div th:if="${token}">

            <!-- Помилка валідації (паролі не збігаються тощо) -->
            <div th:if="${error}"
                 style="background:#fdecea; color:#c62828; border:1px solid #ef9a9a;
                        border-radius:8px; padding:14px 16px; margin-bottom:20px;
                        font-family:'Cormorant Garamond',serif; font-size:1.05rem; text-align:center;">
                ⚠️ <span th:text="${error}"></span>
            </div>

            <p style="font-family:'Cormorant Garamond',serif; font-size:1rem; color:#666;
                      margin-bottom:20px; text-align:center;">
                Придумайте новий пароль для вашого акаунту.
            </p>

            <form th:action="@{/reset-password}" method="post" id="resetForm">
                <!-- Передаємо токен прихованим полем -->
                <input type="hidden" name="token" th:value="${token}">

                <div class="input-group">
                    <label>Новий пароль:</label>
                    <input type="password" name="password" id="password"
                           required minlength="6"
                           placeholder="Мінімум 6 символів"
                           autofocus>
                </div>

                <div class="input-group">
                    <label>Підтвердити пароль:</label>
                    <input type="password" name="confirmPassword" id="confirmPassword"
                           required minlength="6"
                           placeholder="Повторіть пароль">
                    <!-- Підказка про збіг паролів — оновлюється в реальному часі -->
                    <small id="matchHint" style="display:none; margin-top:4px;"></small>
                </div>

                <button type="submit" class="login-btn">Зберегти пароль</button>
            </form>
        </div>

        <div class="register-link">
            <a th:href="@{/login}">← Повернутися до входу</a>
        </div>
    </div>
</main>

<footer th:replace="~{footer :: footer}"></footer>

<script>
    // Підказка в реальному часі: паролі збігаються чи ні
    const pwd = document.getElementById('password');
    const confirm = document.getElementById('confirmPassword');
    const hint = document.getElementById('matchHint');

    function checkMatch() {
        if (!confirm.value) {
            hint.style.display = 'none';
            return;
        }
        hint.style.display = 'block';
        if (pwd.value === confirm.value) {
            hint.textContent = 'Паролі збігаються';
            hint.style.color = '#2e7d32';
        } else {
            hint.textContent = '❌ Паролі не збігаються';
            hint.style.color = '#c62828';
        }
    }

    pwd?.addEventListener('input', checkMatch);
    confirm?.addEventListener('input', checkMatch);

    // Додаткова перевірка перед відправкою
    document.getElementById('resetForm')?.addEventListener('submit', function(e) {
        if (pwd.value !== confirm.value) {
            e.preventDefault();
            hint.style.display = 'block';
            hint.textContent = '❌ Паролі не збігаються';
            hint.style.color = '#c62828';
        }
    });
</script>

</body>
</html>
