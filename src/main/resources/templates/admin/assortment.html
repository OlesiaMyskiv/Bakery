<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cake House — Асортимент</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;700&family=Love+Light&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/globals.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<header th:replace="~{header :: header}"></header>

<div class="admin-layout">
    <aside class="admin-sidebar">
        <div class="sidebar-avatar-wrap">
            <div class="sidebar-avatar-circle">
                <img th:if="${adminUser != null and adminUser.profilePicturePath != null}"
                     th:src="${adminUser.profilePicturePath}" alt="Фото">
                <svg th:unless="${adminUser != null and adminUser.profilePicturePath != null}"
                     viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.2">
                    <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
                </svg>
            </div>
            <div class="sidebar-name" th:text="${adminUser != null ? adminUser.username : 'Адмін'}">Анна</div>
            <div class="sidebar-role">СУПЕРАДМІН</div>
        </div>
        <nav class="sidebar-nav">
            <a th:href="@{/admin/orders}"      class="sidebar-link">Замовлення</a>
            <a th:href="@{/admin/users}"       class="sidebar-link">Клієнти</a>
            <a th:href="@{/admin/verification}" class="sidebar-link">Верифікація</a>
            <a th:href="@{/admin/assortment}"  class="sidebar-link active">Асортимент</a>
            <a th:href="@{/admin/reviews}"     class="sidebar-link">Відгуки</a>
            <a th:href="@{/logout}"            class="sidebar-link sidebar-exit">Вихід</a>
        </nav>
    </aside>

    <main class="admin-content">
        <div class="admin-card">
            <h1 class="admin-page-title">Асортимент</h1>

            <!-- ФОРМА ДОДАВАННЯ НОВОГО ТОВАРУ -->
            <div class="assort-form-card">
                <h2 class="form-section-title">Додати новий виріб</h2>

                <form th:action="@{/admin/assortment/add}" method="post" enctype="multipart/form-data"
                      class="assort-add-form">

                    <div class="form-two-col">
                        <!-- ЛІВА КОЛОНКА: Назва та фото -->
                        <div class="form-col">
                            <div class="form-field">
                                <label>Назва виробу *</label>
                                <input type="text" name="name" placeholder="Наприклад: Шоколадне бенто" required>
                            </div>

                            <div class="form-field">
                                <label>Ціна (грн) *</label>
                                <div style="display:flex; gap:10px; align-items:center;">
                                    <input type="number" name="price" placeholder="350" min="1" required style="flex:1;">
                                    <select name="priceUnit" style="width:110px;">
                                        <option value="шт">за шт</option>
                                        <option value="кг">за кг</option>
                                        <option value="порція">за порцію</option>
                                        <option value="набір">за набір</option>
                                    </select>
                                </div>
                            </div>

                            <div class="form-field">
                                <label>Опис</label>
                                <textarea name="description" rows="3"
                                          placeholder="Смак, склад, особливості..."></textarea>
                            </div>

                            <div class="form-field">
                                <label>Фото виробу</label>
                                <input type="file" name="image" accept="image/*">
                            </div>
                        </div>

                        <!-- ПРАВА КОЛОНКА: Категорії -->
                        <div class="form-col">

                            <!-- 1. ЛІНІЙКА ВИРОБІВ (обов'язково) -->
                            <div class="form-field">
                                <label class="category-label">Лінійка виробів *</label>
                                <div class="tag-group">
                                    <label class="tag-radio" th:each="pl : ${productLines}">
                                        <input type="radio" name="productLineId"
                                               th:value="${pl.id}" required>
                                        <span th:text="${pl.name}"></span>
                                    </label>
                                </div>
                            </div>

                            <!-- 2. КАТАЛОГ СМАКІВ -->
                            <div class="form-field">
                                <label class="category-label">Основа смаку</label>
                                <div class="tag-group">
                                    <label class="tag-check">
                                        <input type="radio" name="flavorCategoryId" value="">
                                        <span>— не вказано</span>
                                    </label>
                                    <label class="tag-radio" th:each="fc : ${flavorCategories}">
                                        <input type="radio" name="flavorCategoryId" th:value="${fc.id}">
                                        <span th:text="${fc.name}"></span>
                                    </label>
                                </div>
                            </div>

                            <!-- 3. ПОДІЯ / ДИЗАЙН -->
                            <div class="form-field">
                                <label class="category-label">Подія / Дизайн</label>
                                <div class="tag-group">
                                    <label class="tag-radio">
                                        <input type="radio" name="designCategoryId" value="">
                                        <span>— не вказано</span>
                                    </label>
                                    <label class="tag-radio" th:each="dc : ${designCategories}">
                                        <input type="radio" name="designCategoryId" th:value="${dc.id}">
                                        <span th:text="${dc.name}"></span>
                                    </label>
                                </div>
                            </div>

                            <!-- 4. ДІЄТИЧНІ ОСОБЛИВОСТІ (чекбокси — можна кілька) -->
                            <div class="form-field">
                                <label class="category-label">Дієтичні особливості</label>
                                <div class="tag-group">
                                    <label class="tag-check" th:each="dt : ${dietaryTags}">
                                        <input type="checkbox" name="dietaryTagIds" th:value="${dt.id}">
                                        <span th:text="${dt.name}"></span>
                                    </label>
                                </div>
                            </div>

                            <!-- 5. ТЕРМІНОВІСТЬ -->
                            <div class="form-field">
                                <label class="category-label">Терміновість</label>
                                <div class="tag-group">
                                    <label class="tag-radio" th:each="u : ${urgencyOptions}">
                                        <input type="radio" name="urgencyId" th:value="${u.id}">
                                        <span th:text="${u.name}"></span>
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="btn-add-assort">Додати до каталогу</button>
                </form>
            </div>

            <!-- СПИСОК ІСНУЮЧИХ ТОВАРІВ -->
            <h2 class="form-section-title" style="margin-top:32px;">Поточний каталог</h2>

            <!-- Фільтр -->
            <div class="assort-filter-row">
                <a th:href="@{/admin/assortment}" class="assort-filter-btn"
                   th:classappend="${currentFilter == null or currentFilter == 'all'} ? ' active'">Всі</a>
                <a th:each="pl : ${productLines}"
                   th:href="@{/admin/assortment(line=${pl.id})}"
                   th:text="${pl.name}"
                   class="assort-filter-btn"
                   th:classappend="${currentFilter == pl.id.toString()} ? ' active'"></a>
            </div>

            <div class="admin-table-wrap">
                <table class="admin-table">
                    <thead>
                    <tr>
                        <th>Фото</th>
                        <th>Назва</th>
                        <th>Лінійка</th>
                        <th>Смак</th>
                        <th>Подія</th>
                        <th>Ціна</th>
                        <th>Стан</th>
                        <th>Дії</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${products.empty}">
                        <td colspan="8" class="empty-row">Каталог порожній — додайте перший виріб!</td>
                    </tr>
                    <tr th:each="p : ${products}"
                        th:classappend="${!p.available} ? ' row-dim'">
                        <td>
                            <img th:if="${p.imagePath != null}"
                                 th:src="${p.imagePath}"
                                 class="product-thumb-sm" alt="фото">
                            <div th:if="${p.imagePath == null}" class="no-thumb">—</div>
                        </td>
                        <td>
                            <strong th:text="${p.name}"></strong>
                            <div class="text-muted"
                                 th:if="${p.description != null}"
                                 th:text="${#strings.abbreviate(p.description, 50)}"></div>
                        </td>
                        <td th:text="${p.productLine != null ? p.productLine.name : '—'}"></td>
                        <td th:text="${p.flavorCategory != null ? p.flavorCategory.name : '—'}"></td>
                        <td th:text="${p.designCategory != null ? p.designCategory.name : '—'}"></td>
                        <td th:text="${p.price} + ' грн / ' + ${p.priceUnit}"></td>
                        <td>
                            <span th:if="${p.available}" class="status-available">Активний</span>
                            <span th:if="${!p.available}" class="status-hidden">Прихований</span>
                        </td>
                        <td>
                            <div style="display:flex; flex-direction:column; gap:4px;">
                                <form th:action="@{/admin/assortment/{id}/toggle(id=${p.id})}" method="post">
                                    <button th:text="${p.available} ? 'Приховати' : 'Показати'"
                                            class="btn-sm btn-blue"></button>
                                </form>
                                <form th:action="@{/admin/assortment/{id}/delete(id=${p.id})}" method="post"
                                      th:onsubmit="'return confirm(\'Видалити ' + ${p.name} + '?\')'">
                                    <button class="btn-sm btn-red">Видалити</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>
</body>
</html>
