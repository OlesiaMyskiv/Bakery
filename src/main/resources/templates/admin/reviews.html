<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cake House — Відгуки</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;700&family=Love+Light&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/globals.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/adm-reviews.css}">
</head>
<body>

<header th:replace="~{header :: header}"></header>

<div class="admin-layout">
    <aside class="admin-sidebar">
        <div class="sidebar-avatar-wrap">
            <div class="sidebar-avatar-circle">
                <img th:if="${adminUser != null and adminUser.profilePicturePath != null}"
                     th:src="${adminUser.profilePicturePath}" alt="Фото">
                <svg th:unless="${adminUser != null and adminUser.profilePicturePath != null}"
                     viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.2">
                    <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
                </svg>
            </div>
            <div class="sidebar-name" th:text="${adminUser != null ? adminUser.username : 'Адмін'}"></div>
            <div class="sidebar-role">СУПЕРАДМІН</div>
        </div>
        <nav class="sidebar-nav">
            <a th:href="@{/admin/orders}"       class="sidebar-link">Замовлення</a>
            <a th:href="@{/admin/users}"        class="sidebar-link">Клієнти</a>
            <a th:href="@{/admin/verification}" class="sidebar-link">Верифікація</a>
            <a th:href="@{/admin/assortment}"   class="sidebar-link">Асортимент</a>
            <a th:href="@{/admin/reviews}"      class="sidebar-link active">Відгуки</a>
            <a th:href="@{/admin/chats}"        class="sidebar-link" style="display:flex;align-items:center;justify-content:space-between;">
                <span>Чати</span>
                <span id="admin-global-unread-dot" class="ca-unread-dot" style="display:none;margin:0;"></span>
            </a>
            <a th:href="@{/logout}"             class="sidebar-link sidebar-exit">Вихід</a>
        </nav>
    </aside>

    <main class="admin-content">
        <div class="admin-card">

            <div class="admin-header-container">
                <h1 class="admin-page-title">
                    Відгуки
                    <span class="reviews-count"
                          th:if="${reviews != null}"
                          th:text="'(' + ${#lists.size(reviews)} + ')'"></span>
                </h1>

                <button id="editToggle" class="btn-edit-mode" onclick="toggleEditMode()">
                    Редагувати
                </button>
            </div>


            <div th:if="${reviews == null or reviews.empty}"
                 style="text-align:center;color:#aaa;padding:60px;font-family:'Cormorant Garamond',serif;font-size:1.1rem;">
                Відгуків ще немає
            </div>

            <!-- СІТКА ВІДГУКІВ -->
            <div class="reviews-grid" th:unless="${reviews == null or reviews.empty}">

                <div class="review-card-admin" th:each="r : ${reviews}"
                     th:classappend="${r.hidden} ? ' review-hidden-card'">

                    <!-- Заголовок: аватар + ім'я + замовлення + дата -->
                    <div class="rca-header">
                        <img th:if="${r.user != null and r.user.profilePicturePath != null}"
                             th:src="${r.user.profilePicturePath}" class="rca-avatar" alt=""
                             onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                        <div th:classappend="${r.user != null and r.user.profilePicturePath != null} ? '' : ''"
                             class="rca-avatar-placeholder"
                             th:style="${r.user != null and r.user.profilePicturePath != null} ? 'display:none;' : ''"
                             th:text="${r.user != null ? #strings.substring(r.user.username,0,1) : '?'}"></div>
                        <div class="rca-author-info">
                            <div class="rca-author-name" th:text="${r.user != null ? r.user.username : 'Анонім'}"></div>
                            <div class="rca-order-date">
                                <span th:if="${r.order != null}">Замовлення №<span th:text="${r.order.id}"></span></span>
                                <span th:if="${r.createdAt != null}"
                                      th:text="${' · ' + #temporals.format(r.createdAt,'dd.MM.yyyy')}"></span>
                                <span th:if="${r.hidden}" class="rca-hidden-badge">приховано</span>
                            </div>
                        </div>
                    </div>

                    <!-- Зірки -->
                    <div class="rca-stars">
                        <span th:each="i : ${#numbers.sequence(1,5)}"
                              th:style="${i <= r.rating} ? 'color:#e8829a;' : 'color:#e0c4c4;'">★</span>
                    </div>

                    <!-- Фото товарів замовлення -->
                    <div th:if="${r.order != null}"
                         class="rca-order-items"
                         th:with="rawItems=${r.order.composition != null ? r.order.composition : ''},
                                  items=${#strings.contains(rawItems,'|') ? #strings.arraySplit(rawItems,'|') : #strings.arraySplit(rawItems,';')}">

                        <div th:each="item, stat : ${items}" class="rca-order-row"
                             th:unless="${(#strings.startsWith(#strings.trim(item),';;')) or
                                         (#strings.startsWith(#strings.trim(item),'Бісквіт:') and not #strings.contains(item,' — ')) or
                                         (#strings.startsWith(#strings.trim(item),'Крем:') and not #strings.contains(item,' — ')) or
                                         (#strings.startsWith(#strings.trim(item),'Начинка:') and not #strings.contains(item,' — '))}"
                             th:with="mainPart=${#strings.contains(item,';;')?#strings.substringBefore(item,';;'):item},
                                      layersStr=${#strings.contains(item,';;')?#strings.substringAfter(item,';;'):''}">

                            <!-- Фото: перший товар — реальне, решта — плейсхолдер -->
                            <div th:if="${stat.index == 0}">
                                <img th:if="${r.order.aiImageUrl != null}"
                                     th:src="${r.order.aiImageUrl}" class="rca-item-img" alt="">
                                <div th:if="${r.order.aiImageUrl == null and r.order.constructorImg != null}"
                                     class="cake-preview" style="display:inline-block;">
                                    <img th:src="${r.order.constructorImg}" class="rca-item-img" alt="">
                                </div>
                                <img th:if="${r.order.aiImageUrl == null and r.order.constructorImg == null and r.order.firstImagePath != null}"
                                     th:src="${r.order.firstImagePath}" class="rca-item-img" alt="">
                                <div th:if="${r.order.aiImageUrl == null and r.order.constructorImg == null and r.order.firstImagePath == null}"
                                     class="rca-item-img-placeholder">🎂</div>
                            </div>
                            <div th:unless="${stat.index == 0}"
                                 class="rca-item-img-placeholder"
                                 th:id="'ra-placeholder-' + ${r.id} + '-' + ${stat.index}">🎂</div>

                            <span th:if="${stat.index == 0 and r.order.imagesJson != null}"
                                  th:attr="data-images-json=${r.order.imagesJson}"
                                  th:id="'ra-images-' + ${r.id}"
                                  style="display:none;"></span>

                            <!-- Назва, ціна і шари конструктора -->
                            <div class="rca-item-info">
                                <th:block th:with="trimmed=${#strings.trim(mainPart)}">
                                    <div class="rca-item-name"
                                         th:text="${#strings.contains(trimmed,' — ') ? #strings.substringBefore(trimmed,' — ') : trimmed}"></div>
                                    <div class="rca-item-price"
                                         th:if="${#strings.contains(trimmed,' — ')}"
                                         th:text="${#strings.substringAfter(trimmed,' — ')}"></div>
                                    <ol class="rca-layers-list" th:if="${!#strings.isEmpty(layersStr)}">
                                        <li th:each="layer : ${#strings.arraySplit(layersStr,';;')}"
                                            th:if="${!#strings.isEmpty(#strings.trim(layer))}"
                                            th:text="${#strings.trim(layer)}"></li>
                                    </ol>
                                </th:block>
                            </div>
                        </div>

                    </div>

                    <!-- Текст відгуку -->
                    <div class="rca-text" th:text="${r.text}"></div>

                    <!-- Фото від клієнта -->
                    <div th:if="${r.photoPath != null}" style="display:flex;flex-direction:column;gap:4px;">
                        <div style="font-family:'Cormorant Garamond',serif;font-size:0.85rem;color:#aaa;">
                            Фото від клієнта:
                        </div>
                        <img th:src="${r.photoPath}"
                             class="rca-client-photo" alt="Фото від клієнта"
                             style="cursor:pointer;" onclick="window.open(this.src,'_blank')">
                    </div>

                    <!-- Існуюча відповідь -->
                    <div class="rca-existing-reply" th:if="${r.adminReply != null}">
                        Відповідь: <span th:text="${r.adminReply}"></span>
                    </div>

                    <!-- Поле відповіді -->
                    <form class="rca-reply-wrap" th:action="@{/admin/reviews/{id}/reply(id=${r.id})}" method="post">
                        <input type="hidden" name="filter" th:value="${filter}">
                        <input type="text" name="reply" class="rca-reply-input"
                               th:value="${r.adminReply}"
                               placeholder="Відповісти клієнту...">
                        <button type="submit" class="rca-reply-btn">Надіслати</button>
                    </form>

                    <!-- Кнопки управління (тільки в режимі редагування) -->
                    <div class="rca-controls edit-only">
                        <form th:action="@{/admin/reviews/{id}/hide(id=${r.id})}" method="post" style="display:inline;">
                            <input type="hidden" name="filter" th:value="${filter}">
                            <button type="submit" class="rca-btn-hide"
                                    th:text="${r.hidden} ? 'Показати' : 'Приховати'"></button>
                        </form>
                        <form th:action="@{/admin/reviews/{id}/delete(id=${r.id})}" method="post" style="display:inline;">
                            <input type="hidden" name="filter" th:value="${filter}">
                            <button type="submit" class="rca-btn-delete" title="Видалити">
                                <img src="/img/recycle-icon.svg" style="width:16px;height:16px;" alt="Видалити">
                            </button>
                        </form>
                    </div>

                </div>
            </div>
        </div>
    </main>
</div>

<script th:src="@{/js/admin.js}"></script>
<script>
    // Підставляємо фото з imagesJson для всіх товарів
    document.addEventListener('DOMContentLoaded', function() {
        document.querySelectorAll('[id^="ra-images-"]').forEach(function(el) {
            var reviewId = el.id.replace('ra-images-', '');
            try {
                var images = JSON.parse(el.getAttribute('data-images-json'));
                images.forEach(function(imgSrc, idx) {
                    if (idx === 0) return; // перший вже показаний через th:src
                    var placeholder = document.getElementById('ra-placeholder-' + reviewId + '-' + idx);
                    if (placeholder && imgSrc) {
                        var imgEl = document.createElement('img');
                        imgEl.src = imgSrc;
                        imgEl.className = 'rca-item-img';
                        imgEl.alt = '';
                        placeholder.parentNode.replaceChild(imgEl, placeholder);
                    }
                });
            } catch(e) {}
        });
    });

    // Режим редагування
    var editMode = false;
    function toggleEditMode() {
        editMode = !editMode;
        var btn = document.getElementById('editToggle');

        document.querySelectorAll('.edit-only').forEach(function(el) {
            el.style.display = editMode ? 'flex' : 'none';
        });

        // Тепер змінюємо текст та прозорість замість кольору
        btn.textContent = editMode ? 'Зберегти' : 'Редагувати';

        if (editMode) {
            btn.style.backgroundColor = '#2d8a9e'; // Колір при режимі збереження
        } else {
            btn.style.backgroundColor = '#3AA6B9'; // Повертаємо оригінальний
        }
    }
</script>
</body>
</html>
