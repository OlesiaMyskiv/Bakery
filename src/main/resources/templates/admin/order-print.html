<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Замовлення №<span th:text="${order.id}"></span></title>
    <link rel="stylesheet" th:href="@{/css/adm-order-print.css}">

</head>
<body>

<!-- Шапка -->
<div class="print-header">
    <div class="print-logo">Cake House</div>
    <div class="print-order-num">
        <strong>Замовлення №<span th:text="${order.id}"></span></strong>
        <span th:text="${order.createdAt != null ? #temporals.format(order.createdAt,'dd.MM.yyyy') : ''}"></span>
    </div>
</div>

<!-- Дедлайн -->
<div class="print-deadline-block">
    <div class="print-deadline-label">Дедлайн — готово до</div>
    <div class="print-deadline-value"
         th:text="${order.deadline != null ? #temporals.format(order.deadline,'dd.MM.yyyy  HH:mm') : '—'}">
    </div>
</div>

<!-- Клієнт -->
<div class="print-client-block">
    <div class="print-field">
        <span class="print-field-label">Клієнт</span>
        <span class="print-field-value" th:text="${order.user != null ? order.user.username : '—'}"></span>
    </div>
    <div class="print-field">
        <span class="print-field-label">Телефон</span>
        <span class="print-field-value" th:text="${order.user != null ? order.user.phone : '—'}"></span>
    </div>
    <div class="print-field">
        <span class="print-field-label">Доставка</span>
        <span class="print-field-value" th:text="${order.address ?: '—'}"></span>
    </div>
</div>

<!-- Склад замовлення -->
<div class="print-section-title">Склад замовлення</div>
<div class="print-items" id="printItemsContainer">
    <!-- рендериться через JS нижче -->
</div>
<span id="print-composition-raw"
      th:attr="data-composition=${order.composition},
               data-images-json=${order.imagesJson},
               data-ai-img=${order.aiImageUrl},
               data-constructor-img=${order.constructorImg},
               data-first-img=${order.firstImagePath}"
      style="display:none;"></span>

<!-- Нижній блок: вага + сума -->
<div class="print-bottom-grid">
    <div class="print-bottom-block" th:if="${order.weightKg != null}">
        <div class="print-field-label">Вага торта</div>
        <div class="print-field-value" th:text="${order.weightKg} + ' кг'"></div>
    </div>
    <div class="print-bottom-block">
        <div class="print-field-label">Сума</div>
        <div class="print-field-value" th:text="${order.price} + ' грн'"></div>
    </div>
    <div class="print-bottom-block">
        <div class="print-field-label">Оплата</div>
        <div class="print-field-value"
             th:text="${order.paymentStatus != null ? order.paymentStatus.label : '—'}"></div>
    </div>
    <div class="print-bottom-block">
        <div class="print-field-label">Статус</div>
        <div class="print-field-value"
             th:text="${order.orderStatus != null ? order.orderStatus.name() : '—'}"></div>
    </div>
</div>

<!-- Коментар -->
<div class="print-comment" th:if="${order.comment != null and !#strings.isEmpty(order.comment)}">
    💬 <strong>Коментар клієнта:</strong>
    <span th:text="${order.comment}"></span>
</div>

<!-- Підпис -->
<div class="print-footer">
    <span>Cake House — кондитерська</span>
    <span th:text="'Роздруковано: ' + ${#temporals.format(#temporals.createNow(),'dd.MM.yyyy HH:mm')}"></span>
</div>

<!-- Кнопки (не друкуються) -->
<div class="no-print">
    <button class="btn-close-print" onclick="window.close()">✕ Закрити</button>
    <button class="btn-print-now" onclick="window.print()">🖨 Роздрукувати</button>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        var rawEl = document.getElementById('print-composition-raw');
        if (!rawEl) return;

        var composition = rawEl.getAttribute('data-composition') || '';
        var imagesJson  = rawEl.getAttribute('data-images-json') || '[]';
        var aiImg       = rawEl.getAttribute('data-ai-img');
        var constrImg   = rawEl.getAttribute('data-constructor-img');
        var firstImg    = rawEl.getAttribute('data-first-img');

        var images = [];
        try { images = JSON.parse(imagesJson); } catch(e) {}

        // Розпізнаємо шар: рядок є шаром якщо починається з "Тип: " без " — "
        var LAYER_TYPES = ['Бісквіт:', 'Крем:', 'Начинка:'];
        function isLayer(s) {
            s = s.trim();
            // новий формат ;;
            if (s.startsWith(';;')) return true;
            // старий формат: є тип але немає " — "
            for (var i = 0; i < LAYER_TYPES.length; i++) {
                if (s.startsWith(LAYER_TYPES[i]) && s.indexOf(' — ') === -1) return true;
            }
            return false;
        }

        // Розбиваємо по " | " але зберігаємо ;; всередині рядка
        var MARKER = '';
        var safe = composition.replace(/;;/g, MARKER);
        var parts = safe.includes(' | ') ? safe.split(' | ') : safe.split(';');

        // Групуємо: товар + його шари
        var groups = [];
        parts.forEach(function(raw) {
            raw = raw.replace(new RegExp(MARKER, 'g'), ';;').trim();
            if (!raw) return;

            if (isLayer(raw)) {
                // Додаємо до останньої групи
                if (groups.length > 0) {
                    groups[groups.length - 1].layers.push(raw.replace(/^;;/, '').trim());
                }
            } else {
                // Новий формат з ;; в середині рядка
                var layers = [];
                if (raw.indexOf(';;') !== -1) {
                    var layersStr = raw.substring(raw.indexOf(';;') + 2);
                    raw = raw.substring(0, raw.indexOf(';;')).trim();
                    layers = layersStr.split(';;').map(function(l){ return l.trim(); }).filter(Boolean);
                }
                groups.push({ raw: raw, layers: layers });
            }
        });

        var container = document.getElementById('printItemsContainer');
        container.innerHTML = '';

        groups.forEach(function(g, idx) {
            var namePart  = g.raw;
            var pricePart = '';
            if (g.raw.indexOf(' — ') !== -1) {
                namePart  = g.raw.substring(0, g.raw.indexOf(' — '));
                pricePart = g.raw.substring(g.raw.indexOf(' — ') + 3);
            }

            // Фото
            var imgSrc = images[idx] || null;
            if (!imgSrc && idx === 0) {
                imgSrc = (aiImg && aiImg !== 'null') ? aiImg
                    : (constrImg && constrImg !== 'null') ? constrImg
                        : (firstImg && firstImg !== 'null') ? firstImg : null;
            }
            if (namePart.indexOf('Солодощі для ЗСУ') !== -1 || namePart.indexOf('🇺🇦') !== -1) {
                imgSrc = '/img/energy_ua.png';
            }

            var imgHtml = imgSrc && imgSrc !== 'null'
                ? '<img src="' + imgSrc + '" class="print-item-img" alt="">'
                : '<span class="print-item-img-placeholder">🎂</span>';

            // Шари
            var layersHtml = '';
            if (g.layers.length > 0) {
                layersHtml = '<ol class="print-layers-list">';
                g.layers.forEach(function(l, li) {
                    layersHtml += '<li>' + l + '</li>';
                });
                layersHtml += '</ol>';
            }

            var row = document.createElement('div');
            row.className = 'print-item-row';
            row.innerHTML =
                '<div class="print-img-wrap">' + imgHtml + '</div>' +
                '<div>' +
                '<div class="print-item-name">' + namePart + '</div>' +
                (pricePart ? '<div class="print-item-qty">' + pricePart + '</div>' : '') +
                layersHtml +
                '</div>';
            container.appendChild(row);
        });

        // Чекаємо фото і друкуємо
        setTimeout(function() {
            var allImgs = document.querySelectorAll('img');
            var loaded = 0, total = allImgs.length;
            function tryPrint() { if (++loaded >= total) setTimeout(function(){ window.print(); }, 200); }
            if (total === 0) { window.print(); }
            else { allImgs.forEach(function(img) {
                if (img.complete && img.naturalWidth > 0) tryPrint();
                else { img.onload = tryPrint; img.onerror = tryPrint; }
            }); }
        }, 150);
    });
</script>
</body>
</html>
