<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cake House — Клієнти</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;700&family=Love+Light&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/globals.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link rel="stylesheet" th:href="@{/css/header.css}">
</head>
<body>

<header th:replace="~{header :: header}"></header>

<div class="admin-layout">
    <aside class="admin-sidebar">
        <div class="sidebar-avatar-wrap">
            <div class="sidebar-avatar-circle">
                <img th:if="${adminUser != null and adminUser.profilePicturePath != null}"
                     th:src="${adminUser.profilePicturePath}" alt="Фото">
                <svg th:unless="${adminUser != null and adminUser.profilePicturePath != null}"
                     viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.2">
                    <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
                </svg>
            </div>
            <div class="sidebar-name" th:text="${adminUser != null ? adminUser.username : 'Адмін'}">Анна</div>
            <div class="sidebar-role">СУПЕРАДМІН</div>
        </div>
        <nav class="sidebar-nav">
            <a th:href="@{/admin/orders}"       class="sidebar-link">Замовлення</a>
            <a th:href="@{/admin/users}"        class="sidebar-link active">Клієнти</a>
            <a th:href="@{/admin/verification}" class="sidebar-link">Верифікація</a>
            <a th:href="@{/admin/assortment}"   class="sidebar-link">Асортимент</a>
            <a th:href="@{/admin/reviews}"      class="sidebar-link">Відгуки</a>
            <a th:href="@{/admin/chats}"        class="sidebar-link">Чати</a>
            <a th:href="@{/logout}"             class="sidebar-link sidebar-exit">Вихід</a>
        </nav>
    </aside>

    <main class="admin-content">
        <div class="admin-card">
            <h1 class="admin-page-title">Список клієнтів</h1>

            <!-- ПОШУК -->
            <div class="search-wrap">
                <input type="text" id="clientSearch"
                       placeholder="Пошук за іменем або номером телефону"
                       class="search-input"
                       oninput="filterClients()">
                <span class="search-icon">&#128269;</span>
            </div>

            <!-- ТАБЛИЦЯ -->
            <div class="admin-table-wrap">
                <table class="admin-table" id="clientsTable">
                    <thead>
                    <tr>
                        <th>Ім'я та прізвище</th>
                        <th>Контакти</th>
                        <th>Кількість замовлень</th>
                        <th>Активні замовлення</th>
                        <th>Загальна сума покупок</th>
                        <th>Історія</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${users.empty}">
                        <td colspan="6" class="empty-row">Клієнтів ще немає</td>
                    </tr>
                    <tr th:each="u : ${users}"
                        th:data-name="${u.username}"
                        th:data-phone="${u.phone}">
                        <td th:text="${u.username}"></td>
                        <td>
                            <span th:text="${u.phone}"></span><br>
                            <span class="text-muted" th:text="${u.email}"></span>
                        </td>
                        <td style="text-align:center;"
                            th:text="${orderCountMap != null and orderCountMap[u.id] != null ? orderCountMap[u.id] : 0}">0</td>
                        <td style="text-align:center;"
                            th:text="${activeCountMap != null and activeCountMap[u.id] != null ? activeCountMap[u.id] : 0}">0</td>
                        <td th:text="${totalSpentMap != null and totalSpentMap[u.id] != null ? totalSpentMap[u.id] + ' грн' : '0 грн'}">0 грн</td>
                        <td>
                            <!-- Кнопка Історія — дизайн як на фото -->
                            <button class="btn-history-modal"
                                    th:data-user-id="${u.id}"
                                    th:data-user-name="${u.username}"
                                    onclick="openHistory(this)">
                                Історія
                            </button>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<!-- ══ СПЛИВАЮЧЕ ВІКНО ІСТОРІЇ ══════════════════════════════════════════════ -->
<div class="history-overlay" id="historyOverlay" onclick="closeHistoryOnOverlay(event)">
    <div class="history-modal">

        <div class="history-modal-header">
            <span class="history-modal-title" id="historyModalTitle">Історія замовлень</span>
            <button class="history-close-btn" onclick="closeHistory()">✕</button>
        </div>

        <div class="history-modal-body" id="historyModalBody">
            <div class="history-loading">Завантаження...</div>
        </div>

    </div>
</div>


<script>
    function openHistory(btn) {
        var userId   = btn.getAttribute('data-user-id');
        var userName = btn.getAttribute('data-user-name');

        document.getElementById('historyModalTitle').textContent =
            'Історія замовлень — ' + userName;
        document.getElementById('historyModalBody').innerHTML =
            '<div class="history-loading">Завантаження...</div>';
        document.getElementById('historyOverlay').classList.add('open');

        fetch('/admin/users/' + userId + '/history', { credentials: 'include' })
            .then(function(r) { return r.json(); })
            .then(function(orders) {
                var body = document.getElementById('historyModalBody');
                if (!orders || orders.length === 0) {
                    body.innerHTML = '<div class="history-empty">Замовлень ще немає</div>';
                    return;
                }
                body.innerHTML = orders.map(function(o) {
                    var statusClass = 'status-' + o.statusKey;
                    return '<div class="history-order-card">' +
                        '<div class="history-order-top">' +
                        '<span class="history-order-num">№' + o.id + '</span>' +
                        '<span class="history-order-date">' + esc(o.createdAt) + '</span>' +
                        '</div>' +
                        '<div class="history-order-composition">' + esc(o.composition) + '</div>' +
                        '<div class="history-order-bottom">' +
                        '<span class="history-status-badge ' + statusClass + '">' + esc(o.status) + '</span>' +
                        '<span class="history-deadline">Дедлайн: ' + esc(o.deadline) + '</span>' +
                        '<span class="history-price">' + esc(o.price) + '</span>' +
                        '</div>' +
                        '</div>';
                }).join('');
            })
            .catch(function() {
                document.getElementById('historyModalBody').innerHTML =
                    '<div class="history-empty">Помилка завантаження</div>';
            });
    }

    function closeHistory() {
        document.getElementById('historyOverlay').classList.remove('open');
    }

    function closeHistoryOnOverlay(e) {
        if (e.target === document.getElementById('historyOverlay')) closeHistory();
    }

    function esc(s) {
        return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function filterClients() {
        var q    = document.getElementById('clientSearch').value.toLowerCase();
        var rows = document.querySelectorAll('#clientsTable tbody tr[data-name]');
        rows.forEach(function(row) {
            var name  = (row.getAttribute('data-name')  || '').toLowerCase();
            var phone = (row.getAttribute('data-phone') || '').toLowerCase();
            row.style.display = (name.includes(q) || phone.includes(q)) ? '' : 'none';
        });
    }
</script>

</body>
</html>
