<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Cake House — Чати</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;700&family=Love+Light&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/globals.css}">
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<header th:replace="~{header :: header}"></header>

<div class="admin-layout">

    <!-- САЙДБАР -->
    <aside class="admin-sidebar">
        <div class="sidebar-avatar-wrap">
            <div class="sidebar-avatar-circle">
                <img th:if="${adminUser != null and adminUser.profilePicturePath != null}"
                     th:src="${adminUser.profilePicturePath}" alt="Фото">
                <svg th:unless="${adminUser != null and adminUser.profilePicturePath != null}"
                     viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.2">
                    <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
                </svg>
            </div>
            <div class="sidebar-name" th:text="${adminUser != null ? adminUser.username : 'Адмін'}">Адмін</div>
            <div class="sidebar-role">СУПЕРАДМІН</div>
        </div>
        <nav class="sidebar-nav">
            <a th:href="@{/admin/orders}"       class="sidebar-link">Замовлення</a>
            <a th:href="@{/admin/users}"        class="sidebar-link">Клієнти</a>
            <a th:href="@{/admin/verification}" class="sidebar-link">Верифікація</a>
            <a th:href="@{/admin/assortment}"   class="sidebar-link">Асортимент</a>
            <a th:href="@{/admin/reviews}"      class="sidebar-link">Відгуки</a>
            <a th:href="@{/admin/chats}"        class="sidebar-link active" style="display: flex; align-items: center; justify-content: space-between;">
                <span>Чати</span>
                <span id="admin-global-unread-dot" class="ca-unread-dot" style="display: none; margin: 0;"></span>
            </a>
            <a th:href="@{/logout}"             class="sidebar-link sidebar-exit">Вихід</a>
        </nav>
    </aside>

    <!-- КОНТЕНТ -->
    <main class="admin-content">
        <div class="admin-card" style="padding: 0; overflow: hidden;">

            <!-- Заголовок -->
            <div style="padding: 24px 32px; border-bottom: 2px solid #f0f0f0;">
                <h1 class="admin-page-title" style="margin:0;">Чати</h1>
            </div>

            <!-- Чат-лейаут всередині картки -->
            <div class="chat-inner-layout">

                <!-- Ліва панель — список -->
                <div class="ca-list">
                    <div class="ca-list-header">Розмови</div>
                    <div class="ca-sessions" id="caSessions">
                        <div class="ca-empty-list">Завантаження...</div>
                    </div>
                </div>

                <!-- Права панель — розмова -->
                <div class="ca-conv" id="caConv">
                    <div class="ca-conv-placeholder">
                        ← Оберіть чат зі списку
                    </div>
                </div>

            </div>
        </div>
    </main>
</div>

<style>
    /* ── Чат-лейаут всередині admin-card ─────────────────────── */
    .chat-inner-layout {
        display: flex;
        height: 70vh;
        font-family: 'Cormorant Garamond', Georgia, serif;
    }

    /* ── Ліва панель ─────────────────────────────────────────── */
    .ca-list {
        width: 280px;
        min-width: 240px;
        background: #fafafa;
        border-right: 1px solid #f0f0f0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    .ca-list-header {
        padding: 16px 18px 12px;
        font-size: 20px;
        font-weight: 700;
        border-bottom: 1px solid #f0f0f0;
        color: #3AA6B9;
        flex-shrink: 0;
    }

    .ca-sessions { flex: 1; overflow-y: auto; }

    .ca-session-item {
        padding: 14px 16px;
        border-bottom: 1px solid #f5f5f0;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 12px;
        transition: background 0.15s;
    }

    .ca-session-item:hover  { background: #f0f8f9; }
    .ca-session-item.active { background: #e6f4f6; }

    .ca-ava {
        width: 40px; height: 40px;
        border-radius: 50%;
        background: #3AA6B9; color: #fff;
        display: flex; align-items: center; justify-content: center;
        font-size: 18px; font-weight: 700; flex-shrink: 0;
    }

    .ca-session-name { font-size: 17px; font-weight: 700; color: #1a1a1a; }
    .ca-session-time { font-size: 13px; color: #aaa; margin-top: 2px; }

    .ca-unread-dot {
        width: 10px; height: 10px;
        border-radius: 50%;
        background: #e74c3c;
        flex-shrink: 0; margin-left: auto;
    }

    .ca-empty-list {
        padding: 40px 16px;
        text-align: center;
        color: #bbb;
        font-size: 17px;
    }

    /* ── Права панель ────────────────────────────────────────── */
    .ca-conv {
        flex: 1;
        display: flex;
        flex-direction: column;
        background: #f8f9fa;
        overflow: hidden;
    }

    .ca-conv-placeholder {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #ccc;
        font-size: 20px;
    }

    .ca-conv-header {
        padding: 16px 20px;
        background: #fff;
        border-bottom: 1px solid #f0f0f0;
        font-size: 20px;
        font-weight: 700;
        color: #1a1a1a;
        flex-shrink: 0;
    }

    .ca-messages {
        flex: 1;
        overflow-y: auto;
        padding: 16px 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    /* Бульбашки */
    .ca-bbl {
        max-width: 70%;
        padding: 10px 14px;
        border-radius: 14px;
        font-size: 17px;
        line-height: 1.5;
        word-break: break-word;
    }

    .ca-bbl.client {
        background: #fff;
        border: 1px solid #eee;
        align-self: flex-start;
        border-bottom-left-radius: 3px;
        color: #1a1a1a;
        box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }

    .ca-bbl.admin {
        background: #3AA6B9;
        color: #fff;
        align-self: flex-end;
        border-bottom-right-radius: 3px;
    }

    .ca-bbl-time {
        font-size: 12px;
        opacity: 0.6;
        margin-top: 4px;
    }

    .ca-bbl.admin .ca-bbl-time { text-align: right; }

    /* Поле вводу */
    .ca-inp-area {
        padding: 12px 16px;
        border-top: 1px solid #f0f0f0;
        background: #fff;
        display: flex;
        gap: 10px;
        flex-shrink: 0;
    }

    .ca-inp-ta {
        flex: 1;
        border: 1px solid #ddd;
        border-radius: 20px;
        padding: 10px 16px;
        font-family: 'Cormorant Garamond', serif;
        font-size: 17px;
        resize: none;
        height: 44px;
        outline: none;
        transition: border-color 0.15s;
    }

    .ca-inp-ta:focus { border-color: #3AA6B9; }

    .ca-inp-send {
        background: #3AA6B9;
        color: #fff;
        border: none;
        border-radius: 50%;
        width: 44px; height: 44px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        flex-shrink: 0;
    }

    .ca-inp-send:hover { background: #2d8a9e; }
</style>

<script th:src="@{/js/admin.js}"></script>
<script>
    var currentSessionId = null;
    var pollInterval     = null;

    function loadSessions() {
        fetch('/api/admin/chat/sessions', { credentials: 'include' })
            .then(function(r) { return r.json(); })
            .then(function(sessions) {

                // НОВЕ: Перевіряємо чи є хоча б один непрочитаний чат
                var hasUnread = sessions.some(function(s) { return s.unread; });
                var globalDot = document.getElementById('admin-global-unread-dot');
                if (globalDot) {
                    globalDot.style.display = hasUnread ? 'block' : 'none';
                }

                var container = document.getElementById('caSessions');
                if (!sessions || sessions.length === 0) {
                    container.innerHTML = '<div class="ca-empty-list">Поки немає чатів</div>';
                    return;
                }
                container.innerHTML = sessions.map(function(s) {
                    var initials = s.displayName ? s.displayName.charAt(0).toUpperCase() : '?';
                    var time = s.lastMessageAt ? s.lastMessageAt.substring(11, 16) : '';
                    var dot  = s.unread ? '<span class="ca-unread-dot"></span>' : '';
                    return '<div class="ca-session-item" data-id="' + s.id + '" onclick="openSession(' + s.id + ',\'' + esc(s.displayName) + '\')">' +
                        '<div class="ca-ava">' + initials + '</div>' +
                        '<div style="flex:1;min-width:0;">' +
                        '<div class="ca-session-name">' + esc(s.displayName) + '</div>' +
                        '<div class="ca-session-time">' + time + '</div>' +
                        '</div>' +
                        dot +
                        '</div>';
                }).join('');
            })
            .catch(function(e) { console.error(e); });
    }

    function openSession(id, name) {
        currentSessionId = id;

        document.querySelectorAll('.ca-session-item').forEach(function(el) {
            el.classList.toggle('active', el.dataset.id == id);
        });

        var conv = document.getElementById('caConv');
        conv.innerHTML =
            '<div class="ca-conv-header">' + esc(name) + '</div>' +
            '<div class="ca-messages" id="caMessages"><div style="text-align:center;color:#ccc;padding:30px;">Завантаження...</div></div>' +
            '<div class="ca-inp-area">' +
            '<textarea class="ca-inp-ta" id="caInpTa" placeholder="Введіть відповідь..."></textarea>' +
            '<button class="ca-inp-send" onclick="adminSend()">➤</button>' +
            '</div>';

        document.getElementById('caInpTa').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); adminSend(); }
        });

        if (pollInterval) clearInterval(pollInterval);
        fetchConvMsgs();
        pollInterval = setInterval(fetchConvMsgs, 4000);
    }

    function fetchConvMsgs() {
        if (!currentSessionId) return;
        fetch('/api/admin/chat/' + currentSessionId + '/messages', { credentials: 'include' })
            .then(function(r) { return r.json(); })
            .then(function(msgs) {
                var container = document.getElementById('caMessages');
                if (!container) return;
                if (!msgs || msgs.length === 0) {
                    container.innerHTML = '<div style="text-align:center;color:#ccc;padding:30px;">Повідомлень ще немає</div>';
                    return;
                }
                container.innerHTML = msgs.map(function(m) {
                    var cls = m.fromAdmin ? 'admin' : 'client';
                    var t   = m.sentAt ? m.sentAt.substring(11, 16) : '';
                    return '<div class="ca-bbl ' + cls + '">' +
                        '<div>' + esc(m.text) + '</div>' +
                        '<div class="ca-bbl-time">' + t + '</div>' +
                        '</div>';
                }).join('');
                container.scrollTop = container.scrollHeight;
                loadSessions();
            })
            .catch(function() {});
    }

    function adminSend() {
        if (!currentSessionId) return;
        var ta   = document.getElementById('caInpTa');
        var text = ta.value.trim();
        if (!text) return;
        ta.value = '';
        fetch('/api/admin/chat/' + currentSessionId + '/send', {
            method: 'POST', credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: text })
        })
            .then(function() { fetchConvMsgs(); })
            .catch(function() {});
    }

    function esc(s) {
        return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    loadSessions();
    setInterval(loadSessions, 10000);
</script>

</body>
</html>
