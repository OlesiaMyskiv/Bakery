<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Cake House - Відновлення паролю</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;700&family=Love+Light&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/globals.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="login-body">

<header th:replace="~{header :: header}"></header>

<main class="login-main">
    <div class="login-card">
        <h2 class="login-title">Відновлення паролю</h2>

        <form th:action="@{/forgot-password}" method="post">
            <div class="input-group">
                <label>Електронна пошта:</label>
                <input type="email" name="email" required>
            </div>

            <button type="submit" class="login-btn">Нагадати</button>
        </form>

        <div class="register-link">
            Згадали пароль? <a th:href="@{/login}">Увійти</a>
        </div>
    </div>
</main>

</body>
</html>
