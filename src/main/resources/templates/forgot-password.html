<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cake House - Відновлення паролю</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;700&family=Love+Light&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/globals.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="login-body">

<header th:replace="~{header :: header}"></header>

<main class="login-main">
    <div class="login-card">
        <h2 class="login-title">Відновлення паролю</h2>

        <!-- ✅ Тимчасовий пароль згенеровано -->
        <div th:if="${tempPassword}"
             style="background:#fff3e0; border:2px solid #c0665a; border-radius:10px;
                    padding:20px; margin-bottom:20px; text-align:center;">
            <p style="font-family:'Cormorant Garamond',serif; font-size:1rem; color:#5a3a2a; margin:0 0 10px;">
                ✅ Ваш тимчасовий пароль:
            </p>
            <div style="font-family:monospace; font-size:2rem; font-weight:bold;
                        color:#c0665a; letter-spacing:4px; margin-bottom:10px;"
                 th:text="${tempPassword}">
            </div>
            <p style="font-family:'Cormorant Garamond',serif; font-size:0.9rem; color:#888; margin:0;">
                Збережіть його та змініть після входу в профілі.
            </p>
            <a th:href="@{/login}"
               style="display:inline-block; margin-top:14px; padding:10px 24px;
                      background:#c0665a; color:white; border-radius:8px; text-decoration:none;
                      font-family:'Cormorant Garamond',serif; font-size:1rem;">
                Увійти →
            </a>
        </div>

        <!-- ℹ️ Email не знайдено або загальне повідомлення -->
        <div th:if="${successMsg != null and tempPassword == null}"
             style="background:#e8f5e9; color:#2e7d32; border:1px solid #a5d6a7;
                    border-radius:8px; padding:14px 16px; margin-bottom:20px;
                    font-family:'Cormorant Garamond',serif; font-size:1.05rem; text-align:center;">
            ℹ️ <span th:text="${successMsg}"></span>
        </div>

        <!-- Форма — показується тільки якщо ще не надіслано -->
        <div th:if="${tempPassword == null}">
            <p style="font-family:'Cormorant Garamond',serif; font-size:1rem; color:#666;
                      margin-bottom:20px; text-align:center;">
                Введіть вашу електронну пошту — ми згенеруємо тимчасовий пароль.
            </p>

            <form th:action="@{/forgot-password}" method="post">
                <div class="input-group">
                    <label>Електронна пошта:</label>
                    <input type="email" name="email" required
                           placeholder="your@email.com" autofocus>
                </div>
                <button type="submit" class="login-btn">Отримати пароль</button>
            </form>
        </div>

        <div class="register-link">
            Згадали пароль? <a th:href="@{/login}">Увійти</a>
        </div>
    </div>
</main>

</body>
</html>
