<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cake House - Відновлення паролю</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;700&family=Love+Light&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/globals.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="login-body">

<header th:replace="~{header :: header}"></header>

<main class="login-main">
    <div class="login-card">
        <h2 class="login-title">Відновлення паролю</h2>

        <!-- ✅ Успішно надіслано -->
        <div th:if="${successMsg}"
             style="background:#e8f5e9; color:#2e7d32; border:1px solid #a5d6a7;
                    border-radius:8px; padding:14px 16px; margin-bottom:20px;
                    font-family:'Cormorant Garamond',serif; font-size:1.05rem; text-align:center;">
            ✅ <span th:text="${successMsg}"></span>
        </div>

        <!-- ❌ Помилка -->
        <div th:if="${error}"
             style="background:#fdecea; color:#c62828; border:1px solid #ef9a9a;
                    border-radius:8px; padding:14px 16px; margin-bottom:20px;
                    font-family:'Cormorant Garamond',serif; font-size:1.05rem; text-align:center;">
            ⚠️ <span th:text="${error}"></span>
        </div>

        <!-- Форма показується тільки якщо ще не надіслано -->
        <div th:if="${successMsg == null}">
            <p style="font-family:'Cormorant Garamond',serif; font-size:1rem; color:#666;
                      margin-bottom:20px; text-align:center;">
                Введіть вашу електронну пошту — ми надішлемо посилання для створення нового пароля.
            </p>

            <form th:action="@{/forgot-password}" method="post">
                <div class="input-group">
                    <label>Електронна пошта:</label>
                    <input type="email" name="email" required placeholder="your@email.com"
                           autofocus>
                </div>

                <button type="submit" class="login-btn">Надіслати посилання</button>
            </form>
        </div>

        <!-- Після успіху — показуємо тільки кнопку назад -->
        <div th:if="${successMsg != null}" style="text-align:center; margin-top:10px;">
            <p style="font-family:'Cormorant Garamond',serif; color:#888; font-size:0.95rem;">
                Не отримали листа? Перевірте папку "Спам" або
                <a th:href="@{/forgot-password}" style="color:#c0665a;">спробуйте ще раз</a>.
            </p>
        </div>

        <div class="register-link">
            Згадали пароль? <a th:href="@{/login}">Увійти</a>
        </div>
    </div>
</main>

</body>
</html>
