<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Асортимент — Cake House</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;700&family=Love+Light&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/globals.css}">
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/assortment.css}">
</head>
<body>

<header th:replace="~{header :: header}"></header>

<div class="assort-page">

    <!-- ── Вкладки каталогів ──────────────────────────────────────── -->
    <div class="assort-tabs-bar">
        <a th:each="ct : ${catalogTypes}"
           th:href="@{/assortment(catalog=${ct.name()})}"
           th:text="${ct.label}"
           th:classappend="${currentCatalog.name() == ct.name()} ? ' active'"
           class="assort-tab"></a>
    </div>

    <div class="assort-body">

        <!-- ── Ліва панель фільтрів ──────────────────────────────── -->
        <aside class="assort-sidebar">
            <form method="get" th:action="@{/assortment}" id="filterForm">
                <input type="hidden" name="catalog" th:value="${catalog}">

                <div class="filter-reset-wrap">
                    <a th:href="@{/assortment(catalog=${catalog})}" class="filter-reset-link">Скинути фільтри</a>
                </div>

                <!-- Смак (тільки FLAVOR) -->
                <th:block th:if="${currentCatalog.name() == 'FLAVOR'}">
                    <div class="filter-section">
                        <div class="filter-section-title">ОСНОВА</div>
                        <label class="filter-check-label" th:each="fb : ${flavorBases}">
                            <input type="checkbox" name="flavors" th:value="${fb.name()}"
                                   th:checked="${selectedFlavors.contains(fb.name())}">
                            <span th:text="${fb.label}"></span>
                        </label>
                    </div>
                    <div class="filter-section">
                        <div class="filter-section-title">ОСОБЛИВОСТІ</div>
                        <label class="filter-check-label">
                            <input type="checkbox" name="dietary" value="NO_SUGAR"
                                   th:checked="${selectedDietary.contains('NO_SUGAR')}">
                            <span>Без цукру</span>
                        </label>
                        <label class="filter-check-label">
                            <input type="checkbox" name="dietary" value="NO_GLUTEN"
                                   th:checked="${selectedDietary.contains('NO_GLUTEN')}">
                            <span>Без глютену</span>
                        </label>
                        <label class="filter-check-label">
                            <input type="checkbox" name="dietary" value="NO_LACTOSE"
                                   th:checked="${selectedDietary.contains('NO_LACTOSE')}">
                            <span>Без лактози</span>
                        </label>
                        <label class="filter-check-label">
                            <input type="checkbox" name="dietary" value="VEGAN"
                                   th:checked="${selectedDietary.contains('VEGAN')}">
                            <span>Веган</span>
                        </label>
                    </div>
                </th:block>

                <!-- Подія та для кого (тільки DESIGN) -->
                <th:block th:if="${currentCatalog.name() == 'DESIGN'}">
                    <div class="filter-section">
                        <div class="filter-section-title">ПОДІЯ</div>
                        <label class="filter-check-label" th:each="de : ${designEvents}">
                            <input type="checkbox" name="events" th:value="${de.name()}"
                                   th:checked="${selectedEvents.contains(de.name())}">
                            <span th:text="${de.label}"></span>
                        </label>
                    </div>
                    <div class="filter-section">
                        <div class="filter-section-title">ДЛЯ КОГО</div>
                        <label class="filter-check-label" th:each="df : ${designFors}">
                            <input type="checkbox" name="designFor" th:value="${df.name()}"
                                   th:checked="${selectedDesignFor.contains(df.name())}">
                            <span th:text="${df.label}"></span>
                        </label>
                    </div>
                </th:block>

                <!-- Тип виробу (тільки LINE) -->
                <th:block th:if="${currentCatalog.name() == 'LINE'}">
                    <div class="filter-section">
                        <div class="filter-section-title">ТИП ВИРОБУ</div>
                        <label class="filter-check-label" th:each="pl : ${productLines}">
                            <input type="checkbox" name="lines" th:value="${pl.name()}"
                                   th:checked="${selectedLines.contains(pl.name())}">
                            <span th:text="${pl.label}"></span>
                        </label>
                    </div>
                </th:block>

                <!-- Терміновість (всі каталоги) -->
                <div class="filter-section">
                    <div class="filter-section-title">ГОТОВНІСТЬ</div>
                    <label class="filter-check-label" th:each="u : ${urgencies}">
                        <input type="checkbox" name="urgency" th:value="${u.name()}"
                               th:checked="${selectedUrgency.contains(u.name())}">
                        <span th:text="${u.label}"></span>
                    </label>
                </div>

                <!-- Діапазон цін -->
                <div class="filter-section">
                    <div class="filter-section-title">ЦІНА (ГРН)</div>
                    <div class="price-inputs-row">
                        <div class="price-field">
                            <label>Від</label>
                            <input type="number" name="minPrice" th:value="${minPrice}" placeholder="0" min="0">
                        </div>
                        <span class="price-separator">—</span>
                        <div class="price-field">
                            <label>До</label>
                            <input type="number" name="maxPrice" th:value="${maxPrice}" placeholder="∞" min="0">
                        </div>
                    </div>
                </div>

                <button type="submit" class="filter-apply-btn">Застосувати</button>
            </form>
        </aside>

        <!-- ── Права частина: пошук + сортування + товари ────────── -->
        <div class="assort-right">

            <!-- Топ-бар -->
            <div class="assort-top-bar">
                <form method="get" th:action="@{/assortment}" class="search-form-inline">
                    <input type="hidden" name="catalog" th:value="${catalog}">
                    <input type="text" name="q" class="search-input-inline"
                           placeholder="Пошук..." th:value="${searchQuery}">
                </form>

                <div class="assort-top-spacer"></div>

                <div class="sort-wrap">
                    <span class="sort-label">Сортування:</span>
                    <a th:href="@{/assortment(catalog=${catalog}, sort='name_asc')}"
                       th:classappend="${currentSort == 'name_asc'} ? ' sort-active'"
                       class="sort-btn">А–Я</a>
                    <a th:href="@{/assortment(catalog=${catalog}, sort='price_asc')}"
                       th:classappend="${currentSort == 'price_asc'} ? ' sort-active'"
                       class="sort-btn">Дешевше</a>
                    <a th:href="@{/assortment(catalog=${catalog}, sort='price_desc')}"
                       th:classappend="${currentSort == 'price_desc'} ? ' sort-active'"
                       class="sort-btn">Дорожче</a>
                </div>
            </div>

            <!-- Кількість результатів -->
            <div class="assort-count">
                <span th:text="${totalItems}">0</span> товарів
                <span th:if="${searchQuery != null}" th:text="' за запитом «' + ${searchQuery} + '»'"></span>
            </div>

            <!-- Порожній стан -->
            <div th:if="${products.empty}" class="assort-empty">
                🎂 Товарів не знайдено. Спробуйте змінити фільтри.
            </div>

            <!-- Сітка товарів -->
            <div th:unless="${products.empty}" class="products-grid">
                <div class="product-card" th:each="p : ${products}">

                    <!-- Фото + посилання на деталі -->
                    <a th:href="@{/product/{id}(id=${p.id})}" class="product-card-img-wrap"
                       style="display:block;text-decoration:none;">
                        <img th:if="${p.imagePath != null}"
                             th:src="${p.imagePath}" th:alt="${p.name}"
                             class="product-card-img">
                        <div th:unless="${p.imagePath != null}"
                             class="product-card-img-placeholder">🎂</div>

                        <!-- Бейдж знижки ЗСУ -->
                        <div class="defenders-badge" th:if="${p.hasDiscount()}">
                            <div class="defenders-text-top">ЗСУ</div>
                            <div class="defenders-text-bottom"
                                 th:text="'-' + ${p.discountPercent} + '%'"></div>
                        </div>
                    </a>

                    <!-- Тіло картки -->
                    <div class="product-card-body">
                        <div class="product-card-name" th:text="${p.name}"></div>

                        <div class="product-card-prices">
                            <div class="price-row">
                                <span class="price-label">Ціна:</span>
                                <span class="price-value"
                                      th:text="${p.price} + ' ' + ${p.priceUnit}"></span>
                            </div>
                            <div class="price-row defenders-price-row"
                                 th:if="${isVerified and p.hasDiscount()}">
                                <span class="price-label defenders-label">🇺🇦 Захисникам:</span>
                                <span class="price-value defenders-price"
                                      th:text="${p.discountedPrice} + ' ' + ${p.priceUnit}"></span>
                            </div>
                        </div>
                    </div>

                    <!-- Кнопка "Додати в кошик" -->
                    <button class="product-card-btn"
                            th:attr="data-product-id=${p.id},
                                     data-name=${p.name},
                                     data-type=${p.catalogType.name()},
                                     data-image=${p.imagePath != null ? p.imagePath : ''},
                                     data-price-unit=${p.priceUnit},
                                     data-price=${p.price},
                                     data-discount=${p.hasDiscount() ? p.discountedPrice : ''},
                                     data-weight=${p.minWeightKg != null and p.minWeightKg > 0 ? p.minWeightKg : 1},
                                     data-unit=${p.catalogType.name() == 'FLAVOR' ? 'кг' : 'шт'},
                                     data-urgency=${p.urgency != null ? p.urgency.name() : ''}"
                            onclick="handleCartClick(this)">
                        <span class="btn-text">додати в кошик</span>
                        <div class="btn-line-circle">
                            <div class="btn-line"></div>
                            <div class="btn-circle"></div>
                        </div>
                    </button>

                    <!-- Кнопка "Список бажань" -->
                    <button class="wishlist-btn"
                            th:attr="data-product-id=${p.id},
                                     data-name=${p.name},
                                     data-type=${p.catalogType.name()},
                                     data-image=${p.imagePath != null ? p.imagePath : ''},
                                     data-price-unit=${p.priceUnit},
                                     data-price=${p.price},
                                     data-discount=${p.hasDiscount() ? p.discountedPrice : ''},
                                     data-weight=${p.minWeightKg != null and p.minWeightKg > 0 ? p.minWeightKg : 1},
                                     data-unit=${p.catalogType.name() == 'FLAVOR' ? 'кг' : 'шт'},
                                     data-urgency=${p.urgency != null ? p.urgency.name() : ''}"
                            onclick="handleWishlistClick(this)">
                        <span class="wishlist-label">Додати в список бажань</span>
                        <svg class="heart-icon" width="22" height="22" viewBox="0 0 24 24"
                             fill="none" stroke="#DF7481" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Пагінація -->
            <div class="pagination" th:if="${totalPages > 1}">
                <a th:if="${currentPage > 1}"
                   th:href="@{/assortment(catalog=${catalog}, page=${currentPage - 1}, sort=${currentSort})}"
                   class="page-btn">←</a>

                <a th:each="i : ${#numbers.sequence(1, totalPages)}"
                   th:href="@{/assortment(catalog=${catalog}, page=${i}, sort=${currentSort})}"
                   th:text="${i}"
                   th:classappend="${i == currentPage} ? ' active'"
                   class="page-btn"></a>

                <a th:if="${currentPage < totalPages}"
                   th:href="@{/assortment(catalog=${catalog}, page=${currentPage + 1}, sort=${currentSort})}"
                   class="page-btn">→</a>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{footer :: footer}"></footer>

<script src="/js/cart.js"></script>
<script src="/js/wishlist.js"></script>
<script>
    function handleCartClick(btn) {
        var image    = btn.dataset.image    || null;
        var discount = btn.dataset.discount || null;
        var urgency  = btn.dataset.urgency  || null;
        addProductToCart(
            parseInt(btn.dataset.productId),
            btn.dataset.name,
            btn.dataset.type,
            image    === '' ? null : image,
            btn.dataset.priceUnit,
            parseInt(btn.dataset.price),
            discount === '' ? null : parseInt(discount),
            parseFloat(btn.dataset.weight) || 1,
            btn.dataset.unit,
            urgency  === '' ? null : urgency
        );
    }

    function handleWishlistClick(btn) {
        var image    = btn.dataset.image    || '';
        var discount = btn.dataset.discount || null;
        var urgency  = btn.dataset.urgency  || null;
        toggleWishlistFromCard(
            btn,
            btn.dataset.productId,
            btn.dataset.name,
            btn.dataset.type,
            image    === '' ? null : image,
            btn.dataset.priceUnit,
            btn.dataset.price,
            discount === '' ? null : discount,
            btn.dataset.weight,
            btn.dataset.unit,
            urgency  === '' ? null : urgency
        );
    }
</script>

</body>
</html>
